<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4 кнопки</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4f6;font-family:system-ui,-apple-system,sans-serif}.wrap{text-align:center}.buttons{display:grid;grid-template-columns:repeat(2,170px);gap:16px}button{border:0;border-radius:18px;padding:24px 18px;background:#111;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 8px 25px #0002;transition:.15s}button:hover{transform:translateY(-2px)}button:active{transform:scale(.97)}</style></head><body><main class="wrap"><h1>Тестовый сайт</h1><div class="buttons"><button onclick="alert('Нажата кнопка 1')">Кнопка 1</button><button onclick="alert('Нажата кнопка 2')">Кнопка 2</button><button onclick="alert('Нажата кнопка 3')">Кнопка 3</button><button onclick="alert('Нажата кнопка 4')">Кнопка 4</button></div></main></body></html>
