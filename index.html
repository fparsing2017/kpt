<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КПТ — мысли</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#171717;font-family:system-ui,-apple-system,sans-serif}.app{max-width:760px;margin:auto;padding:28px 18px 60px}h1{font-size:30px;margin:0 0 8px}.sub{color:#6b6b72;margin-bottom:24px}.card{background:#fff;border:1px solid #e5e5e8;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #0000000a}.top{display:flex;gap:12px;align-items:center}.thought{flex:1;border:0;background:#171717;color:#fff;border-radius:14px;padding:16px;text-align:left;font-size:16px;font-weight:650;cursor:pointer}.score{width:58px;height:52px;border:2px solid #ddd;border-radius:13px;text-align:center;font-size:20px;font-weight:700;background:#fafafa}.hint{display:none;margin-top:14px;padding:14px;border-radius:14px;background:#f2f2f4;line-height:1.45}.card.open .hint{display:block}.legend{font-size:13px;color:#777;margin:10px 2px 18px}.score:focus{outline:2px solid #111;outline-offset:2px}@media(max-width:520px){h1{font-size:25px}.thought{font-size:15px}.app{padding-top:20px}}</style></head><body><main class="app"><h1>Что сейчас меня цепляет?</h1><div class="sub">Нажми на мысль и оцени её силу сейчас от 1 до 10.</div><div id="cards"></div><div class="legend">1 — почти не цепляет · 10 — очень сильно</div></main><script>
const items=[
["Война","<strong>Перепрограммирование:</strong><br>Война → здесь безопасно.<br><br><strong>Адаптивная мысль:</strong><br>Да, это может случиться. А сейчас мне остаётся радоваться жизни."],["Поиск угроз","<strong>Перепрограммирование:</strong><br>Угроза → сейчас я в безопасности.<br><br><strong>Адаптивная мысль:</strong><br>Мне не нужно постоянно искать угрозы, чтобы быть в безопасности. Если возникнет проблема — я решу её по шагам."],
["Много задач / не успеваю","Не успеваю → ресурсы защищены → я в безопасности, потому что я взрослый."],
["Деньги / стану бедным","У меня есть ресурсы и опыт. Если возникнет проблема — я буду решать её по шагам."],
["Работа / всё обрушится","Одна рабочая ситуация не определяет мою безопасность и ценность. Я могу действовать посильно."],
["Я не справлюсь","Мне не нужно заранее уметь справиться со всем. Если проблема появится — решу её по шагам."],
["Надо всё контролировать","Моя безопасность не требует просчитывать все варианты. Я могу принять риски и жить дальше."],
["Надо выложиться на максимум","Выматывание не убирает риски. Посильный темп не делает меня менее защищённым."],
["Я должен быть продуктивным","Моя ценность не зависит от скорости и масштабности. Я имею право отдыхать без вины."]
];
const root=document.getElementById("cards");
items.forEach((x,i)=>{const c=document.createElement("section");c.className="card";c.innerHTML='<div class="top"><button class="thought">'+x[0]+'</button><input class="score" type="number" inputmode="numeric" min="1" max="10" placeholder="—" aria-label="Оценка от 1 до 10"></div><div class="hint">'+x[1]+'</div>';c.querySelector(".thought").onclick=()=>c.classList.toggle("open");root.appendChild(c)});
</script></body></html>
